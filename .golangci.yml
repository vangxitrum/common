version: "2"

# golangci-lint config for aioz-common, applied from team-playbook's
# init-source template: /home/tuan/work/team-playbook/templates/golangci-lint/
# See that folder's README.md for the requirement -> config traceability
# table and rationale.

linters:
  enable:
    # Logging policy: enforce log/slog.
    - depguard
    # Flag `make([]T, 0)` / `var s []T` inside loops that append a known
    # number of elements, force preallocation with the right capacity.
    - prealloc
    # Flag HTTP response bodies that are not closed.
    - bodyclose
    # Flag sql.Rows / sql.Stmt that are not closed.
    - sqlclosecheck
    # Flag missing rows.Err() after rows.Next() loops.
    - rowserrcheck

    # DoD "no commented-out code": gocritic's commentedOutCode check.
    # Also brings in gocritic's broader diagnostic/style checks.
    - gocritic
    # naming.md (package/var/const naming): surface violations as lint
    # findings instead of relying only on review-time enforcement.
    - revive
    # Catches typos in identifiers, comments, and log/error strings,
    # cheap check, no config needed beyond enabling it.
    - misspell

  settings:
    staticcheck:
      # Disable ST1000, do not require package comments.
      # Disable ST1005, we allow punctuation/newlines in error strings.
      # Disable S1016, allow manual struct field copying instead of conversion.
      checks:
        - "all"
        - "-ST1000"
        - "-ST1005"
        - "-S1016"

    errcheck:
      # Do not flag unchecked errors from Close() calls.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close

    depguard:
      rules:
        enforce-slog:
          list-mode: lax
          files:
            - $all
          allow:
            - "log/slog"
          deny:
            - pkg: "log"
              desc: "use log/slog"
            - pkg: "github.com/sirupsen/logrus"
              desc: "disallowed logger; use log/slog"
            - pkg: "go.uber.org/zap"
              desc: "disallowed logger; use log/slog"
            - pkg: "go.uber.org/zap/zapcore"
              desc: "disallowed logger; use log/slog"
            - pkg: "github.com/rs/zerolog"
              desc: "disallowed logger; use log/slog"
            - pkg: "github.com/rs/zerolog/log"
              desc: "disallowed logger; use log/slog"
            - pkg: "github.com/golang/glog"
              desc: "disallowed logger; use log/slog"
            - pkg: "k8s.io/klog"
              desc: "disallowed logger; use log/slog"
            - pkg: "k8s.io/klog/v2"
              desc: "disallowed logger; use log/slog"

    gocritic:
      enabled-checks:
        # DoD Universal criterion: "no commented-out code".
        - commentedOutCode

    revive:
      rules:
        # naming.md: package names lowercase/snake_case, not stuttering.
        - name: package-naming
        # naming.md: exported identifiers get PascalCase, unexported camelCase.
        - name: var-naming
        # naming.md: file names snake_case (user_service.go); flags
        # non-idiomatic Go file naming.
        - name: filename-format

    misspell:
      locale: US

formatters:
  # README.md §6 non-negotiable: "auto-format on save and in CI".
  enable:
    - gofmt
    - goimports
