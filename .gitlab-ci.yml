# aioz-common CI: lint + test pipeline (library repo, no build/deploy stage).
# Applied from team-playbook's init-source template:
# /home/tuan/work/team-playbook/templates/golangci-lint/lint.gitlab-ci.yml
# Blocking on purpose: matches team-playbook DoD "linter passes with zero
# warnings" before merge.

stages:
  - lint
  - test
  - integration

variables:
  GOLANGCI_LINT_VERSION: "v2.11.4"
  GO_IMAGE: "registry:5000/go:1.25"

lint:
  stage: lint
  image: ${GO_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    GOLANGCI_LINT_CACHE: "${CI_PROJECT_DIR}/.cache/golangci-lint"
    CGO_ENABLED: "0"
    GOOS: "linux"
    GOARCH: "amd64"
  cache:
    policy: pull-push
    key: "golangci-lint-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - |
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
        | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
    - golangci-lint --version
    - golangci-lint config verify
  script:
    # Blocking: default issues-exit-code (1) is kept, so any lint finding
    # fails this job and the pipeline. The checkstyle report is still
    # written before the non-zero exit.
    - |
      golangci-lint run \
        --output.checkstyle.path=golangci-lint-report.xml \
        ./...
  artifacts:
    when: always
    paths:
      - golangci-lint-report.xml
    expire_in: 1 week

test:
  stage: test
  image: ${GO_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    CGO_ENABLED: "0"
  cache:
    policy: pull-push
    key: "go-test-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  script:
    - go test ./...

# The container tests: everything the two client packages exist for - a
# reconnect after the broker really goes away, a redelivery, a drain - can only
# be exercised against a real server, so this job runs one. It is a separate
# stage because it needs a privileged runner for docker-in-docker, which the
# lint and test jobs must not wait on.
integration:
  stage: integration
  image: ${GO_IMAGE}
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # Ryuk reaps containers by binding back to the daemon, which is awkward
    # across the service link. The job container is ephemeral, so there is
    # nothing left to reap.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # Without this, container.Host() resolves to something the job container
    # cannot reach.
    TESTCONTAINERS_HOST_OVERRIDE: "docker"
    # Turns a skipped container test into a failure, so this job cannot
    # quietly stop testing anything.
    AIOZ_REQUIRE_DOCKER: "1"
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    CGO_ENABLED: "1"
  cache:
    policy: pull-push
    key: "go-integration-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  script:
    # The dind service can still be booting when this starts, and testcontainers
    # does not treat an unanswered DOCKER_HOST as an error - it quietly falls
    # back to a mounted /var/run/docker.sock (see configuredDaemon in the
    # docker_test.go files). Wait for the service, and fail here if it never
    # comes up.
    - timeout 60 bash -c 'until (exec 3<>/dev/tcp/docker/2375) 2>/dev/null; do sleep 1; done'
    - go test -race -timeout 20m ./redis/... ./rabbitmq/... ./postgres/...
