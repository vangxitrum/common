# aioz-common CI: lint + test pipeline (library repo, no build/deploy stage).
# Applied from team-playbook's init-source template:
# /home/tuan/work/team-playbook/templates/golangci-lint/lint.gitlab-ci.yml
# Blocking on purpose: matches team-playbook DoD "linter passes with zero
# warnings" before merge.

stages:
  - lint
  - test
  - integration

variables:
  GOLANGCI_LINT_VERSION: "v2.11.4"
  GO_IMAGE: "registry:5000/go:1.25"

lint:
  stage: lint
  image: ${GO_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    GOLANGCI_LINT_CACHE: "${CI_PROJECT_DIR}/.cache/golangci-lint"
    CGO_ENABLED: "0"
    GOOS: "linux"
    GOARCH: "amd64"
  cache:
    policy: pull-push
    key: "golangci-lint-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git
    - |
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
        | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
    - golangci-lint --version
    - golangci-lint config verify
  script:
    # Blocking: default issues-exit-code (1) is kept, so any lint finding
    # fails this job and the pipeline. The checkstyle report is still
    # written before the non-zero exit.
    - |
      golangci-lint run \
        --output.checkstyle.path=golangci-lint-report.xml \
        ./...
  artifacts:
    when: always
    paths:
      - golangci-lint-report.xml
    expire_in: 1 week

test:
  stage: test
  image: ${GO_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    CGO_ENABLED: "0"
  cache:
    policy: pull-push
    key: "go-test-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  script:
    - go test ./...
    # Compile, tests included, for a 32-bit target: an untyped constant that
    # fits int only on 64-bit (v0.3.2's ParseRetryAfter) otherwise ships.
    - GOARCH=386 go vet ./...

# The container tests: everything the client packages exist for - a reconnect
# after the broker really goes away, a redelivery, a drain - can only be
# exercised against a real server, so this job runs one. It is a separate stage
# so the lint and test jobs do not wait on container starts.
#
# The containers run on the runner's own docker daemon, through the socket the
# runner mounts into every job; testcontainers finds that socket by itself and
# reaches the containers through the job network's gateway. docker-in-docker
# would give each job a daemon of its own, but it needs a privileged runner,
# and ours is not one - the dind service dies at "mount: permission denied".
#
# Sharing the daemon has two consequences the tests account for. Ryuk stays on
# (TESTCONTAINERS_RYUK_DISABLED is deliberately unset): the daemon outlives the
# job, so a cancelled job would otherwise leave its containers running on the
# runner. And a host port can be taken by another job's container, which the
# rabbitmq tests, the only ones that bind a fixed port, retry past.
integration:
  stage: integration
  image: ${GO_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # Turns a skipped container test into a failure, so this job cannot
    # quietly stop testing anything.
    AIOZ_REQUIRE_DOCKER: "1"
    GOMODCACHE: "${CI_PROJECT_DIR}/.cache/go-mod"
    GOCACHE: "${CI_PROJECT_DIR}/.cache/go-build"
    CGO_ENABLED: "1"
  cache:
    policy: pull-push
    key: "go-integration-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  script:
    - go test -race -timeout 20m ./redis/... ./rabbitmq/... ./postgres/...
