# aioz-common CI: the team's shared checks, plus this repository's container
# tests.
#
# The lint, validate and test jobs come from aioz-ci-template's library
# profile. They used to be copied into this file from team-playbook's
# init-source templates, which meant a fix to a check had to be pasted into
# every repository by hand. Now they arrive through include: and a version
# bump.
#
# What this file still owns: the integration stage (container tests, which are
# specific to this repository), the 32-bit vet check, and the private-module
# credentials.

include:
  - project: tuan.quang.tran/aioz-ci-template
    ref: v1.0.0
    file: profiles/library.yml

variables:
  # gitlab.internal hosts aioz-depin/go-sdk, which the depin package imports.
  # 10.0.0.50 is the same GitLab by IP and is not used here, so the default is
  # narrowed to the one host this repository actually needs.
  GO_PRIVATE_HOSTS: "gitlab.internal/"

  # The profile's default, registry:5000/go:1.25, cannot build this module:
  # go.mod requires Go 1.26 and that image sets GOTOOLCHAIN=local, so every Go
  # job stops at "go.mod requires go >= 1.26.0". ci-builder is the Go 1.26
  # image the service repositories already use, and it also trusts
  # gitlab.internal's certificate. Pinned by digest as well as tag.
  GO_IMAGE: "registry:5000/ci-builder:go1.26-8d4e8b9cfefa@sha256:d6c449819418f39d35c5374ec8577717682ec16bc31ed5889af756b716d65b97"

  # Opt-in switch for tools:build. It shows as a dropdown in CI/CD -> Pipelines
  # -> Run pipeline, so building and publishing the tools is a deliberate act
  # and an ordinary push never does it.
  BUILD_TOOLS:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Build the cmd/ tools and upload them to the file server (default branch and tags only)."

# Must list the shared three as well as this repository's own: GitLab replaces
# a redefined `stages:` rather than merging it, so leaving one out drops the
# shared job that uses it.
stages:
  - lint
  - validate
  - test
  - integration
  - tools

# GOPRIVATE takes gitlab.internal off proxy.golang.org and sum.golang.org and
# sends the fetch straight to git; the insteadOf rewrites then authenticate it
# as the job token. Both spellings are rewritten because go resolves the https
# form while the module's own remote is the ssh one. The shared
# .aioz-go-private does all of this - it is referenced rather than repeated.
#
# This depends on the go-sdk project allowing this project's CI_JOB_TOKEN under
# Settings -> CI/CD -> Job token permissions. Without that grant the clone
# fails with a 403 and the job dies at module download.
#
# Referencing .aioz-lint's own before_script after it is required: overriding
# before_script replaces the shared one, and the shared one is what installs
# golangci-lint.
lint:
  before_script:
    - !reference [.aioz-go-private, before_script]
    - !reference [.aioz-lint, before_script]

test:
  before_script:
    - !reference [.aioz-go-private, before_script]
    - !reference [.aioz-test, before_script]

# The framework adapters, httpapi/echoapi and httpapi/ginapi, are modules of
# their own so a service on one framework never builds the other, and so gin's
# dependencies (quic-go 0.59) cannot break depin's libp2p in this module. The
# shared lint and test jobs run from the root, where `./...` stops at a nested
# go.mod, so this job tests and vets each adapter module. Their shared
# conformance suite is what keeps the two answering byte for byte alike.
adapters:
  extends:
    - .aioz-rules
    - .aioz-test
  stage: test
  before_script:
    - !reference [.aioz-go-private, before_script]
    - !reference [.aioz-test, before_script]
  script:
    - make test-adapters

# Compile, tests included, for a 32-bit target: an untyped constant that fits
# int only on 64-bit (v0.3.2's ParseRetryAfter) otherwise ships.
#
# Its own job rather than a line in `test`, because overriding that job's
# script would discard the shared one - and this is a compile check, not a
# test, so it belongs beside lint.
vet-386:
  extends:
    # .aioz-rules as well as .aioz-test: the shared jobs carry their rules
    # through .aioz-rules, and a job extending only .aioz-test would inherit
    # none and so run on every branch push.
    - .aioz-rules
    - .aioz-test
  stage: lint
  variables:
    GOARCH: "386"
    # -race is unavailable on 386, and this job only needs to typecheck.
    CGO_ENABLED: "0"
  before_script:
    - !reference [.aioz-go-private, before_script]
  script:
    - go vet ./...

# The container tests: everything the client packages exist for - a reconnect
# after the broker really goes away, a redelivery, a drain - can only be
# exercised against a real server, so this job runs one. It is a separate stage
# so the lint and test jobs do not wait on container starts.
#
# The containers run on the runner's own docker daemon, through the socket the
# runner mounts into every job; testcontainers finds that socket by itself and
# reaches the containers through the job network's gateway. docker-in-docker
# would give each job a daemon of its own, but it needs a privileged runner,
# and ours is not one - the dind service dies at "mount: permission denied".
#
# Sharing the daemon has two consequences the tests account for. Ryuk stays on
# (TESTCONTAINERS_RYUK_DISABLED is deliberately unset): the daemon outlives the
# job, so a cancelled job would otherwise leave its containers running on the
# runner. And a host port can be taken by another job's container, which the
# rabbitmq tests, the only ones that bind a fixed port, retry past.
#
# Not part of the shared profile: container tests are not library-shaped, and
# most repositories including that profile have none.
integration:
  extends:
    - .aioz-rules
    - .aioz-test
  stage: integration
  variables:
    # Turns a skipped container test into a failure, so this job cannot
    # quietly stop testing anything.
    AIOZ_REQUIRE_DOCKER: "1"
  cache:
    policy: pull-push
    key: "go-integration-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/
  before_script:
    - !reference [.aioz-go-private, before_script]
    - !reference [.aioz-test, before_script]
  script:
    - go test -race -timeout 20m ./redis/... ./rabbitmq/... ./postgres/...

# The internal tools under cmd/ (aiozkey), cross-compiled by `make tools` and
# uploaded to the team file server, where they are downloadable from
# http://10.0.0.106:8021/aioz-common/<tool>/<tag or branch>/<short sha>/.
#
# Runs only when the pipeline is started with BUILD_TOOLS=true, and only on the
# default branch or a tag: a key-generation binary built from an unreviewed
# branch must never land on shared storage where someone might run it. The
# FTP_USER/FTP_PASSWORD variables it needs are protected for the same reason,
# so a branch pipeline could not upload even if this rule were bypassed.
#
# Its own stage, last, so a tool is never published from a commit whose lint,
# tests or container tests failed.
tools:build:
  extends:
    - .aioz-test
  stage: tools
  rules:
    - if: $BUILD_TOOLS == "true" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
  before_script:
    - !reference [.aioz-go-private, before_script]
    # go build stamps the binary from git (aioz-common/version reads it), and
    # git refuses a checkout owned by another uid, which the runner's clone
    # is; without this the build stops at "error obtaining VCS status".
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - make tools
    - ./scripts/ci/upload-tool.sh dist/aiozkey "aioz-common/aiozkey/${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}/${CI_COMMIT_SHORT_SHA}"
